<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INFO-TABLE | Статьи по миру</title>

  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/staty.css">
  <link rel="stylesheet" href="/styles/burger.css">
  <link rel="stylesheet" href="/styles/popul.css">
  <link rel="stylesheet" href="/styles/fact.css">
  <link rel="stylesheet" href="/styles/logis.css">
  <link rel="stylesheet" href="/styles/holiday.css">
  <link rel="stylesheet" href="/styles/filt.css">
  <link rel="icon" type="image/png" href="/img/IT.png?v=777">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>


<body>
  <div id="header"></div>
  <div id="snow"></div>
  <div class="main-grid">
    <!-- ЛЕВАЯ КОЛОНКА -->
    <aside class="left-sidebar">
      <div class="glass-card" style="padding: 0px;">


        <!-- <div class="pogoda-mobile">
          <a id="ms-informer-link-2312b3bf0300f402069ab4ae4b940f7f" class="ms-informer-link"
            href="https://www.meteoservice.ru/weather/overview/dubna">Погода в Дубне</a>
          <script class="ms-informer-script"
            src="https://www.meteoservice.ru/informer/script/2312b3bf0300f402069ab4ae4b940f7f"></script>
        </div> -->
        <!-- Weather widget by https://www.meteoservice.ru -->
        <a id="ms-informer-link-a7b7311be5153391379cf97898f4deb3" class="ms-informer-link"
          href="https://www.meteoservice.ru/weather/overview/dubna">Погода в Дубне</a>
        <script class="ms-informer-script"
          src="https://www.meteoservice.ru/informer/script/a7b7311be5153391379cf97898f4deb3"></script>
        <!-- End -->
      </div>

      <div class="glass-card fact-box">
        <h3>💡 Знаете ли вы?</h3>
        <p id="random-fact">Загрузка интересного факта...</p>
        <button onclick="showNextFact()" class="next-fact-btn">Ещё факт</button>
      </div>

      <div class="glass-card">

        <div id="vacation-timer">Загрузка каникул...</div>
        <img src="/img/img_stylez/каникулы.png" style="width: 50%; margin-top: 10px;" alt="Каникулы">
      </div>

    </aside>

    <!-- ЦЕНТР (ЛЕНТА) -->
    <main class="articles-feed">
      <div class="glass-card admin-zone">
        <h2 style="margin: 0;">Новая статья</h2>
        <input type="text" id="postImage" placeholder="Ссылка на картинку статьи (URL)...">
        <input type="text" id="postTitle" placeholder="Заголовок статьи...">
        <textarea id="postInput" placeholder="Текст статьи..." rows="4"></textarea>
        <button class="publish-btn" onclick="publishPost()">ОПУБЛИКОВАТЬ</button>
      </div>

      <h2 style="margin-left: 10px;">Свежие статьи</h2>
      <div class="tag-filters glass-card">
        <span
          style="font-size: 11px; font-weight: 900; opacity: 0.4; margin-right: 10px; align-self: center;">ФИЛЬТР:</span>
        <button class="filter-btn active" onclick="filterByTag('Все', this)">#Все</button>
        <button class="filter-btn" onclick="filterByTag('Природа', this)">#Природа</button>
        <button class="filter-btn" onclick="filterByTag('Еда', this)">#Еда</button>
        <button class="filter-btn" onclick="filterByTag('Интернет', this)">#Интернет</button>
        <button class="filter-btn" onclick="filterByTag('Технологии', this)">#Технологии</button>

      </div>

      <div id="dynamic-cards">
        <!-- Сюда JS загрузит посты -->
      </div>

      <div id="load-more-container" style="text-align: center; margin: 30px 0;">
        <button type="button" class="filter-btn active" onclick="loadMore()">
          ПОКАЗАТЬ ЕЩЕ
        </button>

      </div>

    </main>
    <!-- ПРАВАЯ КОЛОНКА (ЧАТ) -->
    <aside class="right-sidebar">
      <div class="glass-card trending-box">
        <h3>🔥 Популярное</h3>
        <div id="trending-list">
          <!-- Сюда JS вставит топ-посты -->
        </div>
      </div>
      <div class="glass-card stats-box">
        <h3>📊 Статистика</h3>
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-value" id="stat-posts">0</span>
            <span class="stat-label">Статей</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="stat-likes">0</span>
            <span class="stat-label">Лайков</span>
          </div>

        </div>
      </div>
      <div class="glass-card holiday-widget">
        <div class="calendar-leaf">
          <div class="leaf-top" id="leaf-month">ФЕВРАЛЬ</div>
          <div class="leaf-body" id="leaf-day">19</div>
        </div>
        <div class="holiday-info">
          <span class="holiday-label">СЕГОДНЯ:</span>
          <div id="holiday-text" class="holiday-main"></div>
        </div>
      </div>

    </aside>
  </div>









  <div class="glass-cursor"></div>




  <footer class="footer">
    <p>&copy; 2026 InfoTable.</p>
    <a href="https://github.com/Sozdatel1/Sozdatel1.github.io"><img src="/img/Без названия-Photoroom.png"
        width="60" /></a>
  </footer>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="/scripts/sweetalert2.all.min.js"></script>
  <script type="module" src="/scripts/staty.js"></script>
  <script type="module" src="/scripts/start-api.js"></script>
  <script src="/scripts/header.js"></script>
  <script src="/scripts/logis.js"></script>
  <script src="/scripts/fact.js"></script>
  <script src="/scripts/main.js"></script>
  <!-- 
  
  <script src="/scripts/chat.js"></script>
  
  
  -->

</body>

</html>
