<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="/styles/content.css">
    <link rel="stylesheet" href="/styles/burger.css">
    <link rel="stylesheet" href="/styles/staty.css">
    <link rel="stylesheet" href="/styles/top.css">
    <link rel="stylesheet" href="/styles/scroll.css">
    <link rel="stylesheet" href="/styles/like.css">
    <link rel="stylesheet" href="/styles/sign_in.css">
    <link rel="icon" href="/img/IT.png" type="image/png">
    <title>Статья | iPosters</title>
</head>

<body>

    <header class="header-content">


        <div class="logo">
            <a href="index.html">
                <img src="/img/IT.png?v=777" class="logo-icon">
                <div class="logo-text"> <!-- ОБЕРТКА ДЛЯ СЛОВ -->
                    <span class="logo-neon">i</span>Posters
                </div>
            </a>
        </div>




        <div class="nav-divider"></div> <!-- ВОТ ОНА -->

        <!-- Кнопка бургер (появится на моилах) -->
        <button class="menu-toggle" id="menuToggle" aria-label="Открыть меню">
            <span></span>
        </button>

        <nav class="dropdown-menu" id="headerNav">
            <ul>
                <li><a href="index.html"><img src="/img/images (1)-Photoroom.png" width="21"></a></li>

                <li class="dropdown">
                    <div class="dropdown-link-wrapper">

                    </div>

                </li>




            </ul>


        </nav>
        <!-- <div class="search-container" style=" max-width: 600px; display: flex; gap: 10px; padding: 0 20px;">
    <input type="text" id="searchInput" placeholder="Поиск на iPosters..." 
        style="flex-grow: 1; padding: 12px; border-radius: 10px; border: 2px solid #00d4ff; background: transparent; color: #00d4ff;">
    
    <button id="searchBtn" style="background: #41cfff; border-color: #41cfff; color: #ffffff; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold;  box-shadow: 0 4px 15px rgba(65, 207, 255, 0.4),
        0 0 5px rgba(0, 255, 65, 0.2);">
        Найти
    </button>
</div> -->



        <!-- Кнопка "Войти" (по умолчанию видна) -->
        <button id="login-btn"
            style="padding: 11px; margin-left: auto !important; position: relative; list-style: none; background:#41cfff !important; box-shadow: 0 4px 15px rgba(65, 207, 255, 0.4),
        0 0 5px rgba(0, 255, 65, 0.2); border-radius: 30px; display: none; border: none; font-size: 17px; color: #ffffff; font-weight: bold; cursor: pointer;"
            onclick="openAuthModal()">Войти</button>

        <!-- Кнопка "Профиль" (по умолчанию скрыта) -->
        <!-- <button id="profile-btn"
      style="display: none; width: 90%; background: #ff4d4d00; color: rgb(0, 0, 0); border: none; padding: 8px;  font-size: 17px; border-radius: 4px; cursor: pointer; text-align: left;"><a
        href="profile.html" style="color: #000000; text-decoration: none;  background-color: #41d0ff00;"
        onclick="goToProfile()">Профиль</button> -->


        <li class="profile-menu" id="profile-btn" style="margin-left: auto !important; position: relative; list-style: none; background:#41cfff !important; box-shadow: 0 4px 15px rgba(65, 207, 255, 0.4),
        0 0 5px rgba(0, 255, 65, 0.2); padding: 1px; border-radius: 20px; display: none;">
            <a href="#" id="profile-trigger"
                style="text-decoration: none; font-weight: bold; padding: 10px; display: block; color: rgb(255, 251, 232); margin-left: auto !important; right: 0 !important;">
                <span id="username-display" style="margin-left: auto !important; font-size: 21px;">Загрузка...</span>
                <!-- Ник будет здесь -->
            </a>

            <!-- Выпадающее меню -->
            <ul id="profile-menu"
                style="display: none; position: absolute; top: 100%; left: 0; background: #ffffff; min-width: 220px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; z-index: 1000; list-style: none;">
                <li style="margin-bottom: 1px;">
                    <button
                        style="width: 90%; background: #ff4d4d00; color: rgb(0, 0, 0); border: none; padding: 8px;  font-size: 17px; border-radius: 4px; cursor: pointer; text-align: left;"><a
                            href="profile.html"
                            style="color: #000000; text-decoration: none;  background-color: #41d0ff00;">Профиль</a></button>
                </li>
                <hr>
                <li style="margin-bottom: 1px;">
                    <button onclick="logoutUser()"
                        style="width: 90%; background: #ff4d4d00; color: rgb(0, 0, 0); border: none; padding: 8px;  font-size: 17px; border-radius: 4px; cursor: pointer; text-align: left;">Выйти</button>
                </li>
                <hr>
                <li>
                    <button onclick="deleteMyAccount()"
                        style="width: 90%; background: #ffffff00; color: rgb(0, 0, 0); border: none; padding: 8px;  text-align: left;  border-radius: 4px; cursor: pointer; font-size: 17px;">Удалить
                        аккаунт</button>
                </li>
            </ul>
        </li>



    </header>


    <div class="content-stat">

        <img id="artImage" src="" alt="photo"
            style="display: none; width: 100%; border-radius: 10px; margin-bottom: 20px;">
        <p>Автор: <span id="avtor" style="font-weight: bold; color: #000000;">Загрузка...</span></p>

        <h1 id="artTitle">Загрузка...</h1>




        <div id="delete-art"></div>

        <hr>
        <p id="artText" style="font-size: 20px;
  text-align: left;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 1 !important;">
            <!-- Сюда попадет текст из JSON -->
        </p>
        <hr>
        <div id="likeBtn" onclick="likePost()" style="cursor: pointer; 
color: #ff8000; 
font-weight: bold; 
font-size: 30px;
font-family: Arial, Helvetica, sans-serif; 
gap: 20px; 
margin: 20px; 

padding: 10px; border-radius: 50px;
">
            <span style="border: 2px solid red; 
border-radius: 50px; 
padding: 8px 12px 8px 12px; 
margin-right: 30px; background-color: #ff8000;">
                <img src="/img/staty/thumb_up_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg"></span>
            <span id="artLikes">0</span>
        </div>



        <div id="comments-section" style="margin-top: 50px; border-top: 2px solid #eee; padding-top: 20px; width: 90%;">
            <h3 style="font-size: 30px; font-family: Arial, Helvetica, sans-serif;">💬 Комментарии</h3>

            <!-- Поле ввода -->
            <div style="margin-bottom: 20px;">
                <textarea id="commentInput" placeholder="Ваш комментарий..."
                    style="width: 100%; height: 80px; padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-family: inherit; font-size: 17px; font-family: Arial, Helvetica, sans-serif;"></textarea>
                <button onclick="sendComment()"
                    style="margin-top: 10px;  background: #41cfff;
    color: white;
    border-color: #41cfff;
    box-shadow: 0 4px 15px rgba(65, 207, 255, 0.4),
        0 0 5px rgba(0, 255, 65, 0.2); border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 17px;">
                    Отправить
                </button>
            </div>

            <!-- Список комментариев -->
            <div id="comments-list">
                <p style="color: gray;">Загрузка обсуждения...</p>
            </div>
        </div>


    </div>
    <div id="edit-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:white; padding:20px; border-radius:8px; width:90%; max-width:500px;">
            <h3>Редактировать статью</h3>
            <input type="text" id="editTitle" style="width:100%; margin-bottom:10px; padding:8px;"
                placeholder="Заголовок">
            <textarea id="editText" style="width:100%; height:150px; margin-bottom:10px; padding:8px;"
                placeholder="Текст статьи"></textarea>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button onclick="closeEditModal()"
                    style="background:#aaa; color:white; border:none; padding:8px 15px; cursor:pointer;">Отмена</button>
                <button onclick="saveChanges()"
                    style="background:#20cbff; color:white; border:none; padding:8px 15px; cursor:pointer;">Сохранить</button>
            </div>
        </div>
    </div>





    <div id="auth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <!-- Кнопка "Закрыть" -->
            <button class="modal-close" onclick="closeAuthModal()">✕</button>

            <h2 id="modal-title">Вход в аккаунт</h2>

            <!-- Поля (используем единые ID для входа и регистрации) -->
            <input type="text" id="user" placeholder="Ваш ник">
            <input type="password" id="pass" placeholder="Пароль">
            <div id="auth-error-msg"
                style="color: #ff4141; font-size: 14px; margin-top: 10px; height: 20px; text-shadow: 0 0 5px rgba(255, 65, 65, 0.5);">
            </div>
            <button id="modal-btn" onclick="handleModalAction()">Войти</button>

            <p class="modal-switch">
                <span id="modal-switch-text">Еще нет аккаунта?</span>
                <span id="modal-switch-link" onclick="toggleModalMode()">Создать аккаунт</span>
            </p>
        </div>
    </div>
    <canvas id="confetti-canvas"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;"></canvas>
    <button id="toTopBtn" onclick="scrollToTop()">
        <img src="/img/img_stylez/keyboard_double_arrow_up_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg">
    </button>
    <script type="module" src="scripts/render.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script type="module" src="/scripts/time-read.js"></script>
    <script src="/scripts/sweetalert2.all.min.js"></script>
    <script type="module" src="/scripts/staty.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="/scripts/main.js"></script>

    <script src="/scripts/topButton.js"></script>
    <script src="/scripts/header.js"></script>
    <script src="/scripts/scroll.js"></script>
    <script type="module" src="/scripts/start-api.js"></script>
</body>

</html>
