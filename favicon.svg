<svg width="60" height="50" viewBox="0 0 60 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Задний листок (аналог .sheet-back с твоим translate) -->
    <rect width="70" height="90" fill="#2b2b2b"/>

  <g transform="scale(1.9) translate(-19, -7)">
  <rect x="8" y="9" width="50" height="35" rx="2" fill="#f5f5f5" stroke="#2b2b2b" stroke-width="1"/>
  
  <!-- Передний листок (аналог .sheet-front с твоим translate) -->
  <rect x="3.5" y="4.5" width="50" height="35" rx="2" fill="#f5f5f5" stroke="#2b2b2b" stroke-width="1"/>
  
  <!-- Коричневый квадрат (.brown-box) -->
  <rect x="7.5" y="8.5" width="17" height="17" rx="3" fill="#a67358" stroke="#2b2b2b" stroke-width="1.5"/>
  
  <!-- Линии текста (.lines и .bottom-lines) -->
  <!-- Используем stroke-width="1.5", как у тебя в border-top -->
  <g stroke="#2b2b2b" stroke-width="1.5">
    <!-- Верхний блок линий -->
    <line x1="28.5" y1="9.5" x2="48.5" y2="9.5" />
    <line x1="28.5" y1="15" x2="48.5" y2="15" />
    <line x1="28.5" y1="20.5" x2="40.5" y2="20.5" /> <!-- short: 60% -->
    
    <!-- Нижний блок линий -->
    <line x1="7.5" y1="30" x2="48.5" y2="30" />
    <line x1="7.5" y1="35.5" x2="48.5" y2="35.5" />
  </g>
  </g>
</svg>
