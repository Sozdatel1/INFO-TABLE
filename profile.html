            <button onclick="logoutUser()" style="padding: 10px 15px; background: #ff4d4d; color: white; border: none; border-radius: 5px; cursor: pointer;">Выйти</button>

    <main style="max-width: 1300px; margin: 90px auto 20px auto; padding: 0px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
        
        <!-- КОЛОНКА 1: Создание статьи -->
        <div class="glass-card admin-zone" style="height: 300px;">
        <h2 style="margin: 0;">Напишите свою статью на Info-Table!</h2>
        <input type="text" id="postImage" placeholder="Ссылка на картинку статьи (URL)...">
        <input type="text" id="postTitle" placeholder="Заголовок статьи...">
        <textarea id="postInput" placeholder="Текст статьи..." rows="4"></textarea>
        <button class="publish-btn" onclick="publishPost()">ОПУБЛИКОВАТЬ</button>
      </div>

        <!-- КОЛОНКА 2: Список моих статей -->
        <section>
            <h1>Мои статьи</h1>
            <div class="tag-filters glass-card">
        <span
          style="font-size: 11px; font-weight: 900; opacity: 0.4; margin-right: 10px; align-self: center;">ФИЛЬТР:</span>
        <button class="filter-btn active" onclick="filterByTag('Все', this)">Все</button>
        <button class="filter-btn" onclick="filterByTag('Природа', this)">Природа</button>
        <button class="filter-btn" onclick="filterByTag('Еда', this)">Еда</button>
        <button class="filter-btn" onclick="filterByTag('Интернет', this)">Интернет</button>
        <button class="filter-btn" onclick="filterByTag('Технологии', this)">Технологии</button>

      </div>
            <div id="dynamic-cards" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 15px;">
                <!-- Сюда будут рендериться статьи из базы -->
                <p id="empty-state" style="color: #999;">Вы еще не написали ни одной статьи...</p>
            </div>
        </section>

    </main>
