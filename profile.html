<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="profile">Личный кабинет | iPosters</title>
    <link rel="stylesheet" href="/styles/main.css">

    <link rel="stylesheet" href="/styles/burger.css">
    <link rel="stylesheet" href="/styles/popul.css">
    <link rel="stylesheet" href="/styles/fact.css">
    <link rel="stylesheet" href="/styles/logis.css">
    <link rel="stylesheet" href="/styles/holiday.css">
    <link rel="stylesheet" href="/styles/filt.css">
    <link rel="stylesheet" href="/styles/sign_in.css">
    <link rel="stylesheet" href="/styles/content.css">
    <link rel="icon" type="image/png" href="/img/IT.png?v=777">

    <!-- <link rel="stylesheet" href="style.css"> Твой файл стилей -->
</head>

<body>
    <header class="header-content">


        <div class="logo">
            <a href="index.html">
                <img src="/img/IT.png?v=777" class="logo-icon">
                <div class="logo-text"> <!-- ОБЕРТКА ДЛЯ СЛОВ -->
                    <span class="logo-neon">i</span>Posters
                </div>
            </a>
        </div>




        <div class="nav-divider"></div> <!-- ВОТ ОНА -->

        <!-- Кнопка бургер (появится на моилах) -->
        <button class="menu-toggle" id="menuToggle" aria-label="Открыть меню">
            <span></span>
        </button>

        <nav class="dropdown-menu" id="headerNav">
            <ul>
                <li><a href="index.html"><img src="/img/images (1)-Photoroom.png" width="21"></a></li>

                <li class="dropdown">
                    <div class="dropdown-link-wrapper">

                    </div>

                </li>




            </ul>


        </nav>
        <div class="search-container" style="width: 100%; display: flex; gap: 0px; padding: 0 20px;">
            <!-- Кнопка-лупа -->
            <button class="search-toggle" id="searchToggle" style="display: none;"><img src="/img/serh.png"
                    width="30"></button>

            <!-- МОБИЛЬНЫЙ блок (Dropdown) -->
            <div class="search-dropdown" id="mobileSearchBox" style="display: none;">
                <input type="text" id="mobileSearchInput" class="search-input-mob" placeholder="Поиск на iPosters..."
                    oninput="runSearch(this)">
            </div>

            <!-- ДЕСКТОПНЫЙ блок -->
            <div class="search-box" id="desktopSearchBox" style="width: 100%;">
                <input type="text" id="desktopSearchInput" class="search-input-with-icon"
                    placeholder="Поиск на iPosters..." oninput="runSearch(this)"
                    style=" padding: 12px; border-radius: 10px; border: 2px solid #00d4ff;  color: #00d4ff; width: 100%;">

                <!-- <button id="searchBtn" onclick="runSearch()">Найти</button> -->
            </div>
        </div>





        <!-- Кнопка "Войти" (по умолчанию видна) -->
        <button id="login-btn"
            style="padding: 11px; margin-left: auto !important; position: relative; list-style: none; background:#41cfff !important; box-shadow: 0 4px 15px rgba(65, 207, 255, 0.4),
        0 0 5px rgba(0, 255, 65, 0.2); border-radius: 30px; display: none; border: none; font-size: 17px; color: #ffffff; font-weight: bold; cursor: pointer;"
            onclick="openAuthModal()">Войти</button>

        <!-- Кнопка "Профиль" (по умолчанию скрыта) -->
        <!-- <button id="profile-btn"
        style="display: none; width: 90%; background: #ff4d4d00; color: rgb(0, 0, 0); border: none; padding: 8px;  font-size: 17px; border-radius: 4px; cursor: pointer; text-align: left;"><a
        href="profile.html" style="color: #000000; text-decoration: none;  background-color: #41d0ff00;"
        onclick="goToProfile()">Профиль</button> -->


        <li class="profile-menu" id="profile-btn" style="margin-left: auto !important; position: relative; list-style: none; background:#41cfff !important; box-shadow: 0 4px 15px rgba(65, 207, 255, 0.4),
        0 0 5px rgba(0, 255, 65, 0.2); padding: 1px; border-radius: 20px; display: none;">
            <a href="#" id="profile-trigger"
                style="text-decoration: none; font-weight: bold; padding: 10px; display: block; color: rgb(255, 251, 232); margin-left: auto !important; right: 0 !important;">
                <span id="username-display" style="margin-left: auto !important; font-size: 21px;">Загрузка...</span>
                <!-- Ник будет здесь -->
            </a>

            <!-- Выпадающее меню -->
            <ul id="profile-menu" style="display: none; ">
                <li style="margin-bottom: 1px;">
                    <button
                        style="width: 90%; background: #ff4d4d00; color: rgb(0, 0, 0); border: none; padding: 8px;  font-size: 17px; border-radius: 4px; cursor: pointer; text-align: left;"><a
                            href="profile.html"
                            style="color: #000000; text-decoration: none;  background-color: #41d0ff00;">Профиль</a></button>
                </li>
                <hr>
                <li style="margin-bottom: 1px;">
                    <button onclick="logoutUser()"
                        style="width: 90%; background: #ff4d4d00; color: rgb(0, 0, 0); border: none; padding: 8px;  font-size: 17px; border-radius: 4px; cursor: pointer; text-align: left;">Выйти</button>
                </li>
                <hr>
                <li>
                    <button onclick="deleteMyAccount()"
                        style="width: 90%; background: #ffffff00; color: rgb(0, 0, 0); border: none; padding: 8px;  text-align: left;  border-radius: 4px; cursor: pointer; font-size: 17px;">Удалить
                        аккаунт</button>
                </li>
            </ul>
        </li>



    </header>

    <main class="prof" id="prof">
        <h1 id="akk" style="color: #000000;"> | Профиль</h1>
        <!-- КОЛОНКА 1: Создание статьи -->
        <div class="glass-card admin-zone" style="height: 300px;">
            <h2 style="margin: 0;">Напишите свою статью на iPosters!</h2>
            <input type="text" id="postImage" placeholder="Ссылка на картинку статьи (URL)...">
            <input type="text" id="postTitle" placeholder="Заголовок статьи...">
            <textarea id="postInput" placeholder="Текст статьи..." rows="4"></textarea>
            <button class="publish-btn" onclick="publishPost()">ОПУБЛИКОВАТЬ</button>
        </div>

        <!-- КОЛОНКА 2: Список моих статей -->
        <section>
            <h1 id="result">Мои статьи</h1>
            <div class="tag-filters glass-card">
                <span
                    style="font-size: 11px; font-weight: 900; opacity: 0.4; margin-right: 10px; align-self: center;">ФИЛЬТР:</span>
                <button class="filter-btn active" onclick="filterByTag('Все', this)">Все</button>
                <button class="filter-btn" onclick="filterByTag('Природа', this)">Природа</button>
                <button class="filter-btn" onclick="filterByTag('Еда', this)">Еда</button>
                <button class="filter-btn" onclick="filterByTag('Интернет', this)">Интернет</button>
                <button class="filter-btn" onclick="filterByTag('Технологии', this)">Технологии</button>

            </div>
            <div id="dynamic-cards">
                <!-- Сюда будут рендериться статьи из базы -->
                <p id="empty-state" style="color: #999;">Вы еще не написали ни одной статьи...</p>
            </div>
        </section>

    </main>


    <!-- Подключаем твою логику (модуль) -->

    <script src="/scripts/sweetalert2.all.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script type="module" src="scripts/render.js"></script>
    <script src="scripts/header.js"></script>
       <script src="scripts/main.js"></script>
</body>

</html>
